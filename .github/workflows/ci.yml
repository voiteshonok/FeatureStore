name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run mypy .
      - name: pip-audit
        run: |
          uv export --frozen --no-dev --no-emit-workspace -o /tmp/reqs.txt
          uvx pip-audit -r /tmp/reqs.txt
      - name: promtool
        run: |
          docker run --rm --entrypoint promtool \
            -v "${{ github.workspace }}/infra/prometheus:/config:ro" \
            prom/prometheus:v3.16.0 \
            check config /config/prometheus.yml
          docker run --rm --entrypoint promtool \
            -v "${{ github.workspace }}/infra/prometheus:/config:ro" \
            prom/prometheus:v3.16.0 \
            check rules /config/rules.yml

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest -m "not integration and not e2e"

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest -m integration --no-cov

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - name: Generated API types are current
        run: |
          npm run gen:api
          git diff --exit-code -- src/shared/api/schema.d.ts
      - run: npm run test
      - run: npm run build
      - run: npm audit --audit-level=high
      - name: Dashboard image builds
        working-directory: .
        run: docker compose -f infra/docker-compose.yml build dashboard
