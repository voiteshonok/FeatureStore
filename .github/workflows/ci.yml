name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run mypy .
      - name: promtool
        run: |
          docker run --rm --entrypoint promtool \
            -v "${{ github.workspace }}/infra/prometheus:/config:ro" \
            prom/prometheus:v3.16.0 \
            check config /config/prometheus.yml
          docker run --rm --entrypoint promtool \
            -v "${{ github.workspace }}/infra/prometheus:/config:ro" \
            prom/prometheus:v3.16.0 \
            check rules /config/rules.yml

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest -m "not integration and not e2e"

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest -m integration --no-cov
