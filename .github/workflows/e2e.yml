name: e2e

# A minute of traffic plus a Compose image build. Nightly, or on demand.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

jobs:
  stage2:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - run: make secret up topics test-e2e
