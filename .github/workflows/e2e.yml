name: e2e

# A minute of traffic plus a Compose image build. Nightly, or on demand.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

jobs:
  stage2:
    runs-on: ubuntu-latest
    # stage2 + stage3 + stage4 (2 min traffic with ClickHouse stop/start)
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - run: make secret up topics test-e2e
      - name: Install k6
        run: |
          set -euo pipefail
          K6_VERSION=v0.54.0
          curl -fsSL "https://github.com/grafana/k6/releases/download/${K6_VERSION}/k6-${K6_VERSION}-linux-amd64.tar.gz" \
            | tar -xz --strip-components=1 -C /usr/local/bin "k6-${K6_VERSION}-linux-amd64/k6"
          k6 version
      - name: k6 smoke (direct)
        run: |
          set -euo pipefail
          uv run python experiments/load/sample_tokens.py --n 50
          OUT=experiments/load/runs/smoke-e2e
          mkdir -p "$OUT"
          SMOKE=1 k6 run -e TARGET=direct -e HOST=localhost -e SMOKE=1 \
            --summary-export="$OUT/summary.json" experiments/load/features.js

  dashboard:
    needs: stage2
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - name: Install Playwright
        run: npx playwright install --with-deps chromium
      - name: Start the stack
        working-directory: .
        run: make secret up
      - run: npm run test:e2e
      - name: Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: dashboard/test-results
