repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy .
        language: system
        pass_filenames: false
        types: [python]
        require_serial: true

      - id: no-env-or-secrets
        name: Do not commit .env or secrets/
        language: fail
        files: '(^|/)\.env$|(^|/)secrets/'
        entry: '.env and secrets/ must not be committed'
