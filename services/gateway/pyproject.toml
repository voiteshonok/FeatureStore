[project]
name = "gateway"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "bcrypt>=4.2",
    "fastapi>=0.115",
    "httpx>=0.27",
    "limits>=2.3",
    "prometheus-client>=0.21",
    "psycopg[binary,pool]>=3.3.8",
    "PyJWT>=2.9",
    "schemas",
    "slowapi>=0.1.9",
    "uvicorn>=0.32",
]

[build-system]
requires = ["uv_build>=0.11.17,<0.12.0"]
build-backend = "uv_build"
