[project]
name = "simulator"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.14.3",
    "pyyaml>=6.0",
    "schemas",
]

[project.scripts]
simulator = "simulator.cli:main"

[build-system]
requires = ["uv_build>=0.11.17,<0.12.0"]
build-backend = "uv_build"
